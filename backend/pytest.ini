[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
# Las pruebas usan siempre el usuario administrador (POSTGRES_USER), aunque
# el contenedor traiga DJANGO_SETTINGS_MODULE=production en el entorno.
addopts = --ds=config.settings.development
testpaths =
    apps
    tests
python_files =
    tests.py
    test_*.py
python_classes = Test*
python_functions = test_*
