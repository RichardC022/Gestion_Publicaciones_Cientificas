project:
  type: website
  output-dir: _site
  # Archivos que no son páginas pero deben publicarse tal cual: la referencia estática
  # de la API (Swagger UI) y los diagramas (visor BPMN, vendor/ y out/ los genera el CI).
  resources:
    - api/*
    - diagrams/*
    - diagrams/vendor/*
    - diagrams/out/*

lang: es

website:
  title: "Gestión de Publicaciones Científicas"
  description: "Documentación del sistema editorial de la UNL: guía de uso por rol y documentación técnica."
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Guía de usuario"
        href: usuarios/primeros-pasos.qmd
      - text: "Guía de ingeniería"
        href: ingenieria/vision-general.qmd
      - text: "Referencia de la API"
        href: ingenieria/api.qmd
  sidebar:
    - title: "Guía de usuario"
      style: docked
      contents:
        - usuarios/primeros-pasos.qmd
        - section: "Qué hace cada rol"
          contents:
            - usuarios/autor.qmd
            - usuarios/revisor.qmd
            - usuarios/editor.qmd
            - usuarios/administrador.qmd
            - usuarios/catalogo.qmd
        - usuarios/estados-y-glosario.qmd
    - title: "Guía de ingeniería"
      style: docked
      contents:
        - ingenieria/vision-general.qmd
        - ingenieria/arquitectura.qmd
        - ingenieria/dominio-y-estados.qmd
        - ingenieria/proceso-editorial.qmd
        - ingenieria/api.qmd
        - ingenieria/seguridad.qmd
        - ingenieria/pruebas.qmd
        - ingenieria/despliegue.qmd
        - ingenieria/contribuir.qmd
        - section: "Decisiones de arquitectura (ADR)"
          href: ingenieria/adr/index.qmd
          contents:
            - ingenieria/adr/0001-jwt-con-cookie-de-renovacion.qmd
            - ingenieria/adr/0002-postgresql-como-unica-base-de-datos.qmd
            - ingenieria/adr/0003-doble-ciego-por-diseno.qmd
            - ingenieria/adr/0004-versiones-inmutables-con-sello-sha-256.qmd
            - ingenieria/adr/0005-auditoria-encadenada.qmd
            - ingenieria/adr/0006-django-admin-apagado.qmd
            - ingenieria/adr/0007-contrato-json-universal.qmd
  page-footer:
    left: "Sistema de Gestión de Publicaciones Científicas · UNL"
    right: "Documentación generada con Quarto"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-title: "En esta página"
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    mermaid:
      theme: neutral
