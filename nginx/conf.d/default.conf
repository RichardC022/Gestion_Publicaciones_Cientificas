# Límite de intentos del login de Django Admin (TSK-89). El Admin de Django no
# bloquea intentos fallidos (sí lo hace el login de la API), así que se limita
# por IP en el borde: 5 por minuto y una ráfaga de 5. Las demás URL tienen clave
# vacía y nunca se cuentan.
map $request_uri $admin_login_key {
    default              "";
    ~^/admin/login/      $binary_remote_addr;
}
limit_req_zone  $admin_login_key  zone=admin_login:10m  rate=5r/m;

# Puerto 80: solo redirige a HTTPS (plan §5.3: «redirección 80 -> 443»). Nada de
# la aplicación se sirve en claro.
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    return  301  https://$host$request_uri;
}

server {
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    server_name  _;

    # TLS 1.2 y 1.3 (RNF-06). El certificado se monta en tiempo de ejecución
    # desde `nginx/certs/` y jamás se versiona. No se envía HSTS desde Nginx: el
    # piloto puede usar un certificado autofirmado y HSTS con uno no válido deja
    # al navegador sin acceso (D-06); Django ya lo emite en las respuestas de la
    # API cuando la conexión es segura.
    ssl_certificate           /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key       /etc/nginx/certs/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Cabeceras de seguridad
    add_header  X-Content-Type-Options  "nosniff" always;
    add_header  X-Frame-Options         "DENY" always;
    add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header  Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Límites de carga de PDF (plan sección 4.2 paso 2 y 4.6).
    #
    # Nginx acepta cuerpos de hasta 60 MB (el límite real de 50 MB por PDF
    # lo aplica Django; el margen absorbe el multipart y las cabeceras) y
    # deriva cualquier cuerpo que exceda el buffer de memoria a un archivo
    # temporal en disco ANTES de reenviarlo a Gunicorn:
    #
    # - `client_body_temp_path` es el buffer temporal explícito donde se
    #   materializa el cuerpo en disco (ruta compilada de la imagen oficial).
    # - `proxy_request_buffering on` (valor por defecto, declarado aquí para
    #   dejar explícito el invariante) hace que Gunicorn solo reciba la
    #   petición cuando el cuerpo completo ya está en disco; un cliente lento
    #   o que abandona la carga no consume un worker síncrono de la API.
    client_max_body_size      60m;
    client_body_timeout       120s;
    client_body_temp_path     /var/cache/nginx/client_temp;
    proxy_request_buffering   on;
    proxy_read_timeout        120s;
    proxy_send_timeout        120s;

    # Proxy de la API REST hacia Gunicorn.
    #
    # Cabeceras obligatorias para el backend: Host real (ALLOWED_HOSTS/CSRF),
    # IP del cliente (X-Real-IP) y cadena X-Forwarded-For para auditoría.
    # X-Forwarded-Proto alimenta SECURE_PROXY_SSL_HEADER de Django.
    #
    # `proxy_pass` SIN URI: nginx reenvía la ruta original completa,
    # preservando el trailing slash exacto (p. ej. /api/health/).
    #
    # `/admin/` (Django Admin) usa el mismo proxy: es la herramienta de soporte
    # para dar de alta cuentas y roles institucionales (README §5.6). Es una
    # superficie sensible: contraseña robusta en los superusuarios, el límite de
    # intentos de arriba y, si la red lo permite, restringirla por IP.
    location ~ ^/(api|admin)/ {
        limit_req         zone=admin_login  burst=5  nodelay;
        limit_req_status  429;
        proxy_pass  http://backend:8000;

        # Django también emite estas tres cabeceras (con otro valor de
        # Referrer-Policy): sin ocultarlas la respuesta las llevaría repetidas y
        # con política contradictoria. Nginx es el único dueño de la política
        # de cabeceras de seguridad del borde (TSK-87).
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Referrer-Policy;

        proxy_http_version  1.1;
        # `$http_host` conserva el puerto: con `$host` Django vería «localhost» mientras
        # el Referer dice «localhost:8443» y la comprobación CSRF del Admin fallaría.
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-Host  $host;
        proxy_set_header    X-Request-ID      $request_id;
    }

    # Prefijo sin barra final: se normaliza en el borde antes de proxyar,
    # de modo que Django siempre reciba rutas con su trailing slash.
    location = /api {
        return 301 /api/;
    }

    location /static/ {
        alias  /app/staticfiles/;
        try_files  $uri $uri/ =404;
    }

    location /_protected/ {
        internal;
        alias  /data/media/private/;
        default_type  application/pdf;
        gzip  off;

        add_header  X-Content-Type-Options  "nosniff" always;
        add_header  X-Frame-Options         "DENY" always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header  Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header  Cache-Control           "private, no-store" always;
    }

    location /_catalog/ {
        internal;
        alias  /data/media/public/catalog/;
        default_type  application/pdf;
        gzip  off;

        add_header  X-Content-Type-Options  "nosniff" always;
        add_header  X-Frame-Options         "DENY" always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header  Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header  Cache-Control           "public, max-age=300" always;
    }

    location /media/ {
        deny all;
    }

    location / {
        root        /usr/share/nginx/html;
        try_files   $uri $uri/ /index.html;
    }
}