server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    # Cabeceras de seguridad
    add_header  X-Content-Type-Options  "nosniff" always;
    add_header  X-Frame-Options         "DENY" always;
    add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header  Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Límites de carga de PDF (plan sección 4.2 paso 2 y 4.6).
    #
    # Nginx acepta cuerpos de hasta 60 MB (el límite real de 50 MB por PDF
    # lo aplica Django; el margen absorbe el multipart y las cabeceras) y
    # deriva cualquier cuerpo que exceda el buffer de memoria a un archivo
    # temporal en disco ANTES de reenviarlo a Gunicorn:
    #
    # - `client_body_temp_path` es el buffer temporal explícito donde se
    #   materializa el cuerpo en disco (ruta compilada de la imagen oficial).
    # - `proxy_request_buffering on` (valor por defecto, declarado aquí para
    #   dejar explícito el invariante) hace que Gunicorn solo reciba la
    #   petición cuando el cuerpo completo ya está en disco; un cliente lento
    #   o que abandona la carga no consume un worker síncrono de la API.
    client_max_body_size      60m;
    client_body_timeout       120s;
    client_body_temp_path     /var/cache/nginx/client_temp;
    proxy_request_buffering   on;
    proxy_read_timeout        120s;
    proxy_send_timeout        120s;

    # Proxy de la API REST hacia Gunicorn.
    #
    # Cabeceras obligatorias para el backend: Host real (ALLOWED_HOSTS/CSRF),
    # IP del cliente (X-Real-IP) y cadena X-Forwarded-For para auditoría.
    # X-Forwarded-Proto alimenta SECURE_PROXY_SSL_HEADER de Django.
    #
    # `proxy_pass` SIN URI: nginx reenvía la ruta original completa,
    # preservando el trailing slash exacto (p. ej. /api/health/).
    location /api/ {
        proxy_pass  http://backend:8000;

        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-Host  $host;
        proxy_set_header    X-Request-ID      $request_id;
    }

    # Prefijo sin barra final: se normaliza en el borde antes de proxyar,
    # de modo que Django siempre reciba rutas con su trailing slash.
    location = /api {
        return 301 /api/;
    }

    location /static/ {
        alias  /app/staticfiles/;
        try_files  $uri $uri/ =404;
    }

    location /_protected/ {
        internal;
        alias  /data/media/private/;
        default_type  application/pdf;
        gzip  off;

        add_header  X-Content-Type-Options  "nosniff" always;
        add_header  X-Frame-Options         "DENY" always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header  Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header  Cache-Control           "private, no-store" always;
    }

    location /_catalog/ {
        internal;
        alias  /data/media/public/catalog/;
        default_type  application/pdf;
        gzip  off;

        add_header  X-Content-Type-Options  "nosniff" always;
        add_header  X-Frame-Options         "DENY" always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header  Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header  Cache-Control           "public, max-age=300" always;
    }

    location /media/ {
        deny all;
    }

    location / {
        root        /usr/share/nginx/html;
        try_files   $uri $uri/ /index.html;
    }
}