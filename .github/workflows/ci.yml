name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint, checks and tests
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check apps config

      - name: Black (format check)
        run: black --check apps config --exclude migrations

      - name: isort (import order check)
        run: isort --check --profile black apps config --skip migrations

      - name: Django system check
        run: python manage.py check --settings=config.settings_test

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run test suite
        run: pytest
