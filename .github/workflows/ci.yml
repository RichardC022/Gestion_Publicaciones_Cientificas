name: Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  backend-check:
    name: Django system check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements/development.txt

      - name: Run Django system check
        run: python manage.py check

  backend-tests:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gpc_ci
          POSTGRES_USER: gpc_ci
          POSTGRES_PASSWORD: gpc_ci_password
          TZ: America/Guayaquil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpc_ci -d gpc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Valores exclusivos de CI; no son credenciales de producción.
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: gpc_ci
      POSTGRES_USER: gpc_ci
      POSTGRES_PASSWORD: gpc_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TZ: America/Guayaquil

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements/development.txt

      - name: Verify PostgreSQL backend is configured
        run: |
          if git grep --quiet --untracked "django.db.backends.sqlite" -- config apps; then
            printf 'ERROR: SQLite no está permitido como motor de pruebas.\n' >&2
            exit 1
          fi

      - name: Run backend tests
        run: |
          set +e
          pytest --ds=config.settings
          status=$?
          set -e
          if [ "${status}" -eq 5 ]; then
            printf 'No backend tests collected yet; PostgreSQL job completed without tests.\n'
            exit 0
          fi
          exit "${status}"

  frontend-build:
    name: Angular production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular production bundle
        run: npx ng build --configuration production

  compose-config:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create local environment file from example
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
