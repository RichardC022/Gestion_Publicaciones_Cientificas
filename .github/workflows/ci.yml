name: Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Cobertura mínima (en %) del dominio y los permisos del backend (TSK-85).
  COVERAGE_MIN: "80"

jobs:
  backend-check:
    name: Django system check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements/development.txt

      - name: Run Django system check
        run: python manage.py check

  backend-tests:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gpc_ci
          POSTGRES_USER: gpc_ci
          POSTGRES_PASSWORD: gpc_ci_password
          TZ: America/Guayaquil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpc_ci -d gpc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Valores exclusivos de CI; no son credenciales de producción.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: gpc_ci
      POSTGRES_USER: gpc_ci
      POSTGRES_PASSWORD: gpc_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TZ: America/Guayaquil

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements/development.txt

      - name: Verify PostgreSQL backend is configured
        run: |
          if git grep --quiet --untracked "django.db.backends.sqlite" -- config apps; then
            printf 'ERROR: SQLite no está permitido como motor de pruebas.\n' >&2
            exit 1
          fi

      - name: Verify the test database engine is PostgreSQL
        run: |
          python manage.py shell -c "
          from django.db import connection
          connection.ensure_connection()
          assert connection.vendor == 'postgresql', connection.vendor
          print('Motor de base de datos:', connection.vendor)
          "

      - name: Verify there are no pending migrations
        run: python manage.py makemigrations --check --dry-run

      # Ya no se tolera «ninguna prueba recolectada» (exit 5): sin pruebas, el job falla.
      - name: Run backend tests with coverage
        run: >-
          pytest --ds=config.settings.development
          --cov --cov-report=xml:coverage.xml --cov-report=html:htmlcov
          --cov-report=term:skip-covered

      # El umbral aplica al dominio (servicios) y a los permisos, no a admin ni migraciones.
      - name: Enforce minimum coverage on domain and permissions
        run: >-
          coverage report --skip-empty --fail-under="${COVERAGE_MIN}"
          --include="*/apps/*/services/*.py,*/apps/*/services.py,*/apps/*/permissions.py,*/apps/*/authentication.py"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: warn
          retention-days: 14

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-audit no clasifica por severidad: cualquier vulnerabilidad conocida
      # falla el job. Una excepción justificada se documenta con --ignore-vuln.
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          pip-audit --requirement backend/requirements/production.txt
          pip-audit --requirement backend/requirements/development.txt

  frontend-tests:
    name: Angular type check and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check application and specs
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.spec.json --noEmit

      - name: Run unit tests
        run: npx ng test --watch=false

  frontend-build:
    name: Angular production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular production bundle
        run: npx ng build --configuration production

      # TSK-92: sin sourceMap, sin dependencias de desarrollo y con una imagen final solo de Nginx.
      - name: Check the build is a production build
        working-directory: .
        run: python3 scripts/check_frontend_build.py

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/gpc-frontend
          retention-days: 14

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Lo que se entrega al navegador: críticas y altas fallan el job.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Herramientas de desarrollo (no viajan en el build): se informan sin bloquear.
      - name: Audit development tooling (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  compose-config:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create local environment file from example
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Verify only web publishes ports (80 and 443)
        run: |
          docker compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          published = {n: [p["published"] for p in s.get("ports", [])] for n, s in services.items()}
          print(published)
          ok = (sorted(services) == ["backend", "db", "web"]
                and not published["db"] and not published["backend"]
                and sorted(published["web"]) == ["443", "80"])
          sys.exit(0 if ok else 1)'

      - name: Check runbook and infrastructure decisions Q1-Q5
        run: python3 scripts/check_runbook.py

      - name: Verify no secrets are tracked
        run: |
          if git ls-files | grep -E '^(\.env|credentials\.txt)$'; then
            printf 'ERROR: hay secretos versionados.\n' >&2
            exit 1
          fi

  # E2E de los flujos críticos (TSK-91): Playwright contra el stack real de Compose
  # (Nginx + Django + PostgreSQL). scripts/e2e.sh lo levanta aislado y lo borra al terminar.
  e2e:
    name: Playwright E2E (Docker Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check the E2E suite
        run: npx tsc -p e2e/tsconfig.json
        working-directory: frontend

      # Producción rechaza los valores «change-me»: se usan secretos desechables de la corrida.
      - name: Create environment file with throwaway secrets
        run: |
          cp .env.example .env
          for name in DJANGO_SECRET_KEY POSTGRES_PASSWORD APP_DB_PASSWORD EMAIL_HOST_PASSWORD; do
            sed -i "s|^${name}=change-me$|${name}=$(openssl rand -hex 24)|" .env
          done

      - name: Run the critical-flow E2E tests
        run: ./scripts/e2e.sh

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore

  media-isolation:
    name: Media volume isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test of direct access to the media volume
        run: ./scripts/smoke_media_isolation.sh
