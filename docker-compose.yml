services:
  db:
    image: postgres:16-alpine
    # Sin `ports`: PostgreSQL solo es alcanzable desde `backend_net` (TSK-87,
    # D-03). Para abrirlo en desarrollo existe `docker-compose.dev.yml`.
    restart: unless-stopped
    # Límite de memoria medido en la prueba de carga (TSK-86, pico ~35 MiB).
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # 3 workers de Gunicorn; pico medido en la prueba de carga de 50 MB (TSK-86): ~290 MiB.
    mem_limit: 1g
    memswap_limit: 1g
    # `.env` (creado con permisos 0600 y nunca versionado) porta los
    # secretos de PostgreSQL, Django, JWT, cookies y SMTP del backend.
    env_file: .env
    command: >
      sh -c "umask 0027 &&
             /app/scripts/check_env.sh &&
             /app/scripts/init_media.sh &&
             DB_USE_ADMIN=1 python manage.py migrate --noinput &&
             DB_USE_ADMIN=1 python manage.py apply_db_privileges &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - media_data:/data/media
      - static_data:/app/staticfiles
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend_net
      - frontend_net

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # Único servicio que publica puertos: 80 solo redirige a 443 (TSK-87, D-02).
    ports:
      - "80:80"
      - "443:443"
    # Nginx lleva los cuerpos grandes a disco; pico medido (TSK-86): ~104 MiB.
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - media_data:/data/media:ro
      - static_data:/app/staticfiles:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  backend_net:
    internal: true
  frontend_net: